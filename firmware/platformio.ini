; StatusStackLight - firmware for the 5-lamp stack light
;
; Board: ESP32-S3 DevKitC-1 in the N16R8 variant (16 MB flash, 8 MB octal PSRAM).
; The bundled board definition describes the N8 variant without PSRAM, so flash
; size, partition table and memory type are overridden here.

[platformio]
default_envs = uart

; Two reasons for not building inside the project directory:
;
; 1. Non-ASCII characters in paths are explicitly unsupported by PlatformIO;
;    the hard abort check disappeared in Core 6.2, but the toolchain and
;    esptool still run through a cp1252 console. A build directory outside
;    the project keeps that independent of where the project lives.
; 2. .pio/build is around ten thousand files. In a Dropbox folder that means
;    constant syncing and now and then a locked file in the middle of a build.
build_dir = C:/pio/StatusStackLight

; ---------------------------------------------------------------------------
[env]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 -----------------------------------------------------------------
; Watch the module: ESP32-S3-WROOM-1 N16R8 has quad flash + octal PSRAM and
; needs qio_opi. The SIMILARLY named WROOM-2 N16R8V has 1.8 V octal flash and
; would need opi_opi plus flash_mode = dout - with that, the board here does
; not even boot. When in doubt, read the marking on the module.
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
; Deliberately do NOT set board_upload.maximum_size - PlatformIO derives the
; size from the partition table and would otherwise have two truths.

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.4.3

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; Generates include/web_assets.h from the files in web/ - see scripts/embed_web.py
extra_scripts = pre:scripts/embed_web.py

; ---------------------------------------------------------------------------
; Default: the UART port (labelled "COM" on the enclosure lid).
;
; This is the port where the serial console works reliably: the port survives
; reset and flashing, and you also see the output of the ROM bootloader.
; Serial is UART0 here.
[env:uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; Alternative: the native USB port (lid label "USB").
;
; Works, but the COM port disappears and reappears on every reset - output
; right after startup is lost. That is why main.cpp waits briefly for the host
; in this variant.
[env:usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
