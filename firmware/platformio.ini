; StatusStackLight - Firmware fuer die 5-Lampen-Signalsaeule
;
; Board: ESP32-S3 DevKitC-1 in der Variante N16R8 (16 MB Flash, 8 MB Octal-PSRAM).
; Die mitgelieferte Boarddefinition beschreibt die N8-Variante ohne PSRAM, deshalb
; werden Flashgroesse, Partitionstabelle und Speichertyp hier ueberschrieben.

[platformio]
default_envs = uart

; Zwei Gruende, warum hier nicht im Projektverzeichnis gebaut wird:
;
; 1. Der Projektpfad enthaelt ein "ae" als Umlaut (Signalsaeule). Nicht-ASCII in
;    Pfaden ist von PlatformIO ausdruecklich nicht unterstuetzt; die harte
;    Abbruchpruefung ist zwar aus Core 6.2 verschwunden, aber Toolchain und
;    esptool laufen weiterhin ueber eine cp1252-Konsole.
; 2. .pio/build sind rund zehntausend Dateien. In einem Dropbox-Ordner heisst
;    das Dauersynchronisation und gelegentlich eine gesperrte Datei mitten im
;    Build.
build_dir = C:/pio/StatusStackLight

; ---------------------------------------------------------------------------
[env]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 -----------------------------------------------------------------
; Achtung beim Modul: ESP32-S3-WROOM-1 N16R8 hat Quad-Flash + Octal-PSRAM und
; braucht qio_opi. Das AEHNLICH heissende WROOM-2 N16R8V hat Octal-Flash mit
; 1,8 V und braeuchte opi_opi plus flash_mode = dout - damit startet das Board
; hier gar nicht erst. Im Zweifel den Aufdruck auf dem Modul lesen.
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_build.arduino.memory_type = qio_opi
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
; board_upload.maximum_size bewusst NICHT setzen - PlatformIO leitet die Groesse
; aus der Partitionstabelle ab und haette sonst zwei Wahrheiten.

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.4.3

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; Erzeugt include/web_assets.h aus den Dateien in web/ - siehe scripts/embed_web.py
extra_scripts = pre:scripts/embed_web.py

; ---------------------------------------------------------------------------
; Standard: die UART-Buchse (auf dem Gehaeusedeckel als "COM" beschriftet).
;
; Das ist die Buchse, an der die serielle Konsole zuverlaessig funktioniert: der
; Port bleibt ueber Reset und Flashen hinweg bestehen, und man sieht zusaetzlich
; die Ausgabe des ROM-Bootloaders. Serial ist hier UART0.
[env:uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; Alternative: die native USB-Buchse (Deckelbeschriftung "USB").
;
; Funktioniert, aber der COM-Port verschwindet bei jedem Reset und taucht neu
; auf - Ausgabe direkt nach dem Start geht dabei verloren. Deshalb wartet
; main.cpp in dieser Variante kurz auf den Host.
[env:usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
