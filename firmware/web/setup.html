<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusStackLight &ndash; WLAN einrichten</title>
<style>
:root {
  --bg:    #0f1115;
  --karte: #191d24;
  --rand:  #2a313c;
  --text:  #e6e9ee;
  --grau:  #8d97a6;
  --akzent:#4f9cf9;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.huelle { max-width: 440px; margin: 0 auto; }
h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
.unter { color: var(--grau); font-size: 13px; margin-bottom: 18px; }

.karte {
  background: var(--karte); border: 1px solid var(--rand);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
label { display: block; color: var(--grau); font-size: 13px; margin-bottom: 5px; }
input {
  width: 100%; background: #11151b; color: var(--text);
  border: 1px solid var(--rand); border-radius: 8px;
  padding: 10px; font: inherit; margin-bottom: 14px;
}
input:focus { outline: none; border-color: var(--akzent); }
button {
  width: 100%; background: var(--akzent); color: #06101f; font-weight: 600;
  border: none; border-radius: 8px; padding: 12px; font: inherit;
  font-weight: 600; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }

h2 { font-size: 14px; color: var(--grau); margin: 0 0 10px; font-weight: 600; }
.netz {
  display: flex; align-items: baseline; gap: 8px;
  padding: 9px 4px; border-bottom: 1px solid var(--rand); cursor: pointer;
}
.netz:last-child { border-bottom: none; }
.netz:hover .ssid { color: var(--akzent); }
.ssid { flex: 1; }
.db { color: var(--grau); font-size: 12px; font-variant-numeric: tabular-nums; }

.meldung { border-radius: 8px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }
.meldung.gut     { background: #10291a; border: 1px solid #1f7a45; }
.meldung.schlecht{ background: #2b1416; border: 1px solid #a33; }
.meldung.warte   { background: #1a2030; border: 1px solid #39496b; }
a { color: var(--akzent); }
</style>
</head>
<body>
<div class="huelle">

<h1>WLAN einrichten</h1>
<div class="unter" id="unter">StatusStackLight</div>

<div id="meldung"></div>

<div class="karte">
  <form id="formular">
    <label for="ssid">Netzwerkname (SSID)</label>
    <input id="ssid" name="ssid" autocomplete="off" autocapitalize="none" spellcheck="false" required>

    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password" autocomplete="off">

    <button id="senden" type="submit">Verbinden und speichern</button>
  </form>
</div>

<div class="karte">
  <h2>Gefundene Netze</h2>
  <div id="netze">wird gesucht ...</div>
</div>

<p class="unter"><a href="/">Zurueck zur Steuerung</a></p>

</div>
<script>
"use strict";

function meldung(art, text) {
  document.getElementById("meldung").innerHTML =
    '<div class="meldung ' + art + '">' + text + "</div>";
}

fetch("/api/config").then(a => a.json()).then(c => {
  document.getElementById("unter").textContent =
    c.mode === "ap" ? "Konfigurations-Accesspoint " + c.apName
                    : "verbunden mit " + c.ssid;
  if (c.ssid) document.getElementById("ssid").value = c.ssid;
}).catch(() => {});

fetch("/api/scan").then(a => a.json()).then(d => {
  const ziel = document.getElementById("netze");
  if (!d.networks.length) { ziel.textContent = "keine Netze gefunden"; return; }

  // Staerkstes zuerst, Doppelte (mehrere Accesspoints, gleiche SSID) raus.
  const gesehen = new Set();
  ziel.innerHTML = "";
  d.networks.sort((a, b) => b.rssi - a.rssi).forEach(n => {
    if (!n.ssid || gesehen.has(n.ssid)) return;
    gesehen.add(n.ssid);
    const zeile = document.createElement("div");
    zeile.className = "netz";
    zeile.innerHTML = '<span class="ssid"></span><span class="db">' +
                      n.rssi + " dBm" + (n.encrypted ? " &middot; gesichert" : "") + "</span>";
    zeile.querySelector(".ssid").textContent = n.ssid;
    zeile.onclick = () => {
      document.getElementById("ssid").value = n.ssid;
      document.getElementById("passwort").focus();
    };
    ziel.appendChild(zeile);
  });
}).catch(() => { document.getElementById("netze").textContent = "Suche fehlgeschlagen"; });

document.getElementById("formular").onsubmit = ev => {
  ev.preventDefault();
  const knopf = document.getElementById("senden");
  knopf.disabled = true;

  // Das Geraet probiert die Daten erst aus und speichert nur bei Erfolg.
  // Deshalb dauert die Antwort bis zu 20 Sekunden - und deshalb steht hier ein
  // Hinweis statt eines stumm wartenden Knopfes.
  meldung("warte", "Verbindung wird getestet, das kann bis zu 20 Sekunden dauern ...");

  fetch("/api/config/wifi", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      ssid: document.getElementById("ssid").value,
      password: document.getElementById("passwort").value
    })
  }).then(a => a.json().then(j => {
    knopf.disabled = false;
    if (!a.ok) { meldung("schlecht", j.error || "Fehler " + a.status); return; }
    meldung("gut",
      "Verbunden. Das Geraet ist jetzt unter <b>http://" + j.ip + "/</b> " +
      "beziehungsweise <b>http://statusstacklight.local/</b> erreichbar. " +
      "Diesen Accesspoint kannst du verlassen.");
  })).catch(() => {
    // Erwartbar: sobald die Verbindung steht, bricht der Accesspoint weg und
    // die laufende Anfrage stirbt. Das ist kein Fehler, sondern der Erfolgsfall.
    knopf.disabled = false;
    meldung("gut",
      "Die Verbindung zum Accesspoint ist abgebrochen - das passiert genau dann, " +
      "wenn das Geraet ins WLAN gewechselt ist. Versuche es unter " +
      "<b>http://statusstacklight.local/</b> oder schau im Router nach.");
  });
};
</script>
</body>
</html>
