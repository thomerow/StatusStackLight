<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusStackLight &ndash; WiFi setup</title>
<style>
:root {
  --bg:     #0f1115;
  --card:   #191d24;
  --border: #2a313c;
  --text:   #e6e9ee;
  --muted:  #8d97a6;
  --accent: #4f9cf9;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 440px; margin: 0 auto; }
h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 5px; }
input {
  width: 100%; background: #11151b; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; font: inherit; margin-bottom: 14px;
}
input:focus { outline: none; border-color: var(--accent); }
button {
  width: 100%; background: var(--accent); color: #06101f; font-weight: 600;
  border: none; border-radius: 8px; padding: 12px; font: inherit;
  font-weight: 600; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }

h2 { font-size: 14px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.network {
  display: flex; align-items: baseline; gap: 8px;
  padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.network:last-child { border-bottom: none; }
.network:hover .ssid { color: var(--accent); }
.ssid { flex: 1; }
.db { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.message { border-radius: 8px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }
.message.good { background: #10291a; border: 1px solid #1f7a45; }
.message.bad  { background: #2b1416; border: 1px solid #a33; }
.message.wait { background: #1a2030; border: 1px solid #39496b; }
a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

<h1>WiFi setup</h1>
<div class="sub" id="sub">StatusStackLight</div>

<div id="message"></div>

<div class="card">
  <form id="form">
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" name="ssid" autocomplete="off" autocapitalize="none" spellcheck="false" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="off">

    <button id="submit" type="submit">Connect and save</button>
  </form>
</div>

<div class="card">
  <h2>Networks found</h2>
  <div id="networks">searching ...</div>
</div>

<p class="sub"><a href="/">Back to the controls</a></p>

</div>
<script>
"use strict";

function message(kind, text) {
  document.getElementById("message").innerHTML =
    '<div class="message ' + kind + '">' + text + "</div>";
}

fetch("/api/config").then(r => r.json()).then(c => {
  document.getElementById("sub").textContent =
    c.mode === "ap" ? "Setup access point " + c.apName
                    : "connected to " + c.ssid;
  if (c.ssid) document.getElementById("ssid").value = c.ssid;
}).catch(() => {});

fetch("/api/scan").then(r => r.json()).then(d => {
  const target = document.getElementById("networks");
  if (!d.networks.length) { target.textContent = "no networks found"; return; }

  // Strongest first, duplicates (several access points, same SSID) removed.
  const seen = new Set();
  target.innerHTML = "";
  d.networks.sort((a, b) => b.rssi - a.rssi).forEach(n => {
    if (!n.ssid || seen.has(n.ssid)) return;
    seen.add(n.ssid);
    const row = document.createElement("div");
    row.className = "network";
    row.innerHTML = '<span class="ssid"></span><span class="db">' +
                    n.rssi + " dBm" + (n.encrypted ? " &middot; secured" : "") + "</span>";
    row.querySelector(".ssid").textContent = n.ssid;
    row.onclick = () => {
      document.getElementById("ssid").value = n.ssid;
      document.getElementById("password").focus();
    };
    target.appendChild(row);
  });
}).catch(() => { document.getElementById("networks").textContent = "scan failed"; });

document.getElementById("form").onsubmit = ev => {
  ev.preventDefault();
  const button = document.getElementById("submit");
  button.disabled = true;

  // The device tries the credentials first and only stores them on success.
  // That is why the response takes up to 20 seconds - and why there is a
  // notice here instead of a silently waiting button.
  message("wait", "Testing the connection, this can take up to 20 seconds ...");

  fetch("/api/config/wifi", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      ssid: document.getElementById("ssid").value,
      password: document.getElementById("password").value
    })
  }).then(r => r.json().then(j => {
    button.disabled = false;
    if (!r.ok) { message("bad", j.error || "Error " + r.status); return; }
    message("good",
      "Connected. The device is now reachable at <b>http://" + j.ip + "/</b> " +
      "or <b>http://statusstacklight.local/</b>. " +
      "You can leave this access point.");
  })).catch(() => {
    // Expected: as soon as the connection is up, the access point goes away
    // and the pending request dies. That is not an error but the success case.
    button.disabled = false;
    message("good",
      "The connection to the access point dropped - that happens exactly when " +
      "the device has switched to the WiFi network. Try " +
      "<b>http://statusstacklight.local/</b> or check your router.");
  });
};
</script>
</body>
</html>
